<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hololive Hub</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:thin;scrollbar-color:#2a2a40 #080810}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#080810}
::-webkit-scrollbar-thumb{background:#2a2a40;border-radius:3px}
body{background:#080810;color:#f0f0f8;font-family:'Segoe UI','Helvetica Neue',sans-serif;min-height:100vh}

/* ── Header ── */
.site-header{padding:20px 32px 16px;border-bottom:1px solid #14141f;display:flex;align-items:center;justify-content:space-between;gap:16px}
.site-title{font-size:22px;font-weight:700;letter-spacing:1px;color:#fff}
.site-title span{color:#00b4e8}
.api-btn{background:#14141f;border:1px solid #2a2a40;color:#888;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;transition:border-color .2s,color .2s}
.api-btn:hover{border-color:#444;color:#ccc}

/* ── API Banner ── */
.api-banner{background:#10101c;border:1px solid #1e1e35;border-radius:8px;padding:12px 20px;margin:12px 32px;display:flex;align-items:center;gap:10px;font-size:12px;color:#888;flex-wrap:wrap}
.api-banner a{color:#00b4e8}
.api-banner input{flex:1;min-width:200px;max-width:340px;background:#080810;border:1px solid #2a2a40;border-radius:6px;padding:6px 10px;color:#fff;font-size:12px;outline:none}
.api-banner input:focus{border-color:#00b4e8}
.api-btn-save{background:#00b4e8;color:#000;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.api-btn-clear{background:#1e1e35;color:#888;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
.hidden{display:none!important}

/* ── Section header ── */
.section{padding:22px 32px 6px}
.section-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#666;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;background:#f33;border-radius:50%;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
.refresh-btn{margin-left:auto;font-size:11px;color:#444;cursor:pointer;letter-spacing:0;text-transform:none;font-weight:400;transition:color .15s}
.refresh-btn:hover{color:#888}

/* ── Live row ── */
.scroll-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#1e1e35 transparent}
.scroll-row::-webkit-scrollbar{height:4px}
.scroll-row::-webkit-scrollbar-thumb{background:#1e1e35;border-radius:2px}
.no-data{color:#444;font-size:13px;padding:8px 0}

/* ── Live card ── */
.live-card{flex-shrink:0;width:272px;background:#10101c;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid #1a1a2e;transition:transform .15s,box-shadow .15s}
.live-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.6)}
.live-thumb{position:relative;width:100%;height:153px;background:#0a0a18;overflow:hidden}
.live-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.live-badge{position:absolute;top:8px;left:8px;background:#e03;color:#fff;font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:4px}
.live-info{padding:9px 11px 11px}
.live-ch{font-size:11px;color:#666;margin-bottom:4px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-ch-icon{width:18px;height:18px;border-radius:50%;object-fit:cover;background:#1a1a2e;flex-shrink:0}
.live-title{font-size:12px;line-height:1.45;color:#ccd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Generation sections ── */
.gen-section{padding:16px 32px 2px;border-top:1px solid #0c0c18}
.gen-label{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#bbb;margin-bottom:12px;padding:3px 10px 3px 6px;background:rgba(255,255,255,.03);border-radius:6px}
.gen-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── Member card ── */
.member-card{flex-shrink:0;width:138px;border-radius:10px;overflow:hidden;background:#10101c;border:1px solid #1a1a2e;transition:box-shadow .15s}
.member-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.55)}
.card-wrap{position:relative;width:138px;height:198px;overflow:hidden;background:linear-gradient(160deg,#111120,#0e0e1c)}
.card-portrait{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .35s}
.member-card:hover .card-portrait{transform:scale(1.05)}
.card-half{position:absolute;left:0;width:100%;height:50%;display:flex;align-items:center;justify-content:center;transition:background .18s;text-decoration:none;z-index:2}
.card-half-yt{top:0}
.card-half-tw{bottom:0}
.card-half:hover{background:rgba(0,0,0,.58);backdrop-filter:blur(3px)}
.card-divider{position:absolute;left:8%;width:84%;height:1px;top:50%;background:rgba(255,255,255,.1);z-index:3;pointer-events:none;opacity:0;transition:opacity .18s}
.member-card:hover .card-divider{opacity:1}
.card-icon{opacity:0;transition:opacity .18s,transform .18s;width:30px;height:30px;transform:scale(.7)}
.card-half:hover .card-icon{opacity:1;transform:scale(1)}
.card-name{text-align:center;font-size:11px;color:#aab;padding:6px 4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

footer{text-align:center;padding:28px;font-size:11px;color:#333;border-top:1px solid #0c0c18;margin-top:20px}
footer a{color:#333;text-decoration:none}
footer a:hover{color:#555}
</style>
</head>

<header class="site-header">

<div id="apiBanner" class="api-banner hidden">

<div class="section">

  </div>
</div>

<div class="section">

  </div>

  </div>
</div>

// ============================================================
// API KEY
// ============================================================
function toggleApiInput() {
  const el = document.getElementById('apiBanner');
  el.classList.toggle('hidden');
  if (!el.classList.contains('hidden'))
    document.getElementById('apiKeyInput').value = localStorage.getItem('holodex_api_key') || '';
}
function saveApiKey() {
  const v = document.getElementById('apiKeyInput').value.trim();
  if (v) localStorage.setItem('holodex_api_key', v);
  document.getElementById('apiBanner').classList.add('hidden');
  loadLive();
}
function clearApiKey() {
  localStorage.removeItem('holodex_api_key');
  document.getElementById('apiBanner').classList.add('hidden');
  loadLive();
}

// ============================================================
// MEMBER FILTER — only show streams from members in the list
// ============================================================
// Build Set of known UC channel IDs
const MEMBER_IDS = new Set(
  GENS.flatMap(g => g.members.map(m => m.ytId)).filter(Boolean)
);
// English-name fallback for the 4 ReGLOSS members whose UC ID is unavailable
const MEMBER_EN_NAMES = new Set(
  GENS.flatMap(g => g.members.filter(m => !m.ytId && m.enName).map(m => m.enName))
);
function isMember(s) {
  if (MEMBER_IDS.has(s.channel?.id)) return true;
  const en = s.channel?.english_name || '';
  const jp = s.channel?.name || '';
  return MEMBER_EN_NAMES.has(en) || MEMBER_EN_NAMES.has(jp);
}

// ============================================================
// LIVE STREAMS
// ============================================================
async function loadLive() {
  const row = document.getElementById('liveRow');
  row.innerHTML = '<div class="no-data">正在加载…</div>';
  try {
    const key = localStorage.getItem('holodex_api_key') || '8ebaa672-1238-411d-bd92-09f46f9d7fe7';
    const hdrs = { 'Content-Type': 'application/json' };
    if (key) hdrs['X-APIKEY'] = key;
    const res = await fetch(
      'https://holodex.net/api/v2/live?org=Hololive&type=stream&limit=50&max_upcoming_hours=0',
      { headers: hdrs }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const live = data.filter(s => s.status === 'live' && isMember(s));
    document.getElementById('liveCount').textContent = live.length ? `(${live.length})` : '';
    if (!live.length) { row.innerHTML = '<div class="no-data">目前没有成员在直播</div>'; return; }
    row.innerHTML = live.map(s => {
      const thumb = `https://img.youtube.com/vi/${esc(s.id)}/mqdefault.jpg`;
      const url   = `https://www.youtube.com/watch?v=${esc(s.id)}`;
      const ch    = esc(s.channel?.name || '');
      const icon  = esc(s.channel?.photo || '');
      const title = esc(s.title || '');
      return `<a href="${url}" target="_blank" class="live-card">
        <div class="live-thumb">
          <img src="${thumb}" alt="${title}" loading="lazy">
          <div class="live-badge">LIVE</div>
        </div>
        <div class="live-info">
          <div class="live-ch">${icon ? `<img class="live-ch-icon" src="${icon}" alt="">` : ''}${ch}</div>
          <div class="live-title">${title}</div>
        </div>
      </a>`;
    }).join('');
  } catch(e) {
    row.innerHTML = `<div class="no-data">加载失败 (${esc(e.message)})。请点击 ⚙ 设置 填入 <a href="https://holodex.net/login" target="_blank" style="color:#00b4e8">Holodex API Key</a>。</div>`;
  }
}

// ============================================================
// VIDEOS
// ============================================================
// Official Hololive org channels (excluding Holostars)
const OFFICIAL_IDS = new Set([
  'UCJFZiqLMntJufDCHc6bQixg', // hololive official (JP)
  'UCotXwdjQoiKNxkvrH4Gyy-A', // hololive English
]);
const VIDEO_IDS = new Set([...MEMBER_IDS, ...OFFICIAL_IDS]);

function relTime(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60)       return '刚刚';
  if (s < 3600)     return Math.floor(s / 60)   + ' 分钟前';
  if (s < 86400)    return Math.floor(s / 3600)  + ' 小时前';
  if (s < 2592000)  return Math.floor(s / 86400) + ' 天前';
  if (s < 31536000) return Math.floor(s / 2592000) + ' 个月前';
  return Math.floor(s / 31536000) + ' 年前';
}

async function loadVideos() {
  const row = document.getElementById('videoRow');
  row.innerHTML = '<div class="no-data">正在加载…</div>';
  try {
    const key = localStorage.getItem('holodex_api_key') || '8ebaa672-1238-411d-bd92-09f46f9d7fe7';
    const res = await fetch(
      'https://holodex.net/api/v2/videos?org=Hololive&type=clip&status=past&limit=60&sort=available_at&order=desc',
      { headers: { 'X-APIKEY': key } }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const videos = data.filter(v => {
      const id = v.channel?.id;
      if (VIDEO_IDS.has(id)) return true;
      const en = v.channel?.english_name || '';
      const jp = v.channel?.name || '';
      return MEMBER_EN_NAMES.has(en) || MEMBER_EN_NAMES.has(jp);
    }).slice(0, 30);

    document.getElementById('videoCount').textContent = videos.length ? `(${videos.length})` : '';
    if (!videos.length) { row.innerHTML = '<div class="no-data">暂无视频数据</div>'; return; }

    row.innerHTML = videos.map(v => {
      const thumb = `https://img.youtube.com/vi/${esc(v.id)}/mqdefault.jpg`;
      const url   = `https://www.youtube.com/watch?v=${esc(v.id)}`;
      const ch    = esc(v.channel?.name || '');
      const icon  = esc(v.channel?.photo || '');
      const title = esc(v.title || '');
      const date  = relTime(v.available_at || v.published_at || '');
      return `<a href="${url}" target="_blank" class="live-card">
        <div class="live-thumb">
          <img src="${thumb}" alt="${title}" loading="lazy">
        </div>
        <div class="live-info">
          <div class="live-ch">${icon ? `<img class="live-ch-icon" src="${icon}" alt="">` : ''}${ch}</div>
          <div class="live-title">${title}</div>
          <div style="font-size:11px;color:#444;margin-top:4px">${date}</div>
        </div>
      </a>`;
    }).join('');
  } catch(e) {
    row.innerHTML = `<div class="no-data">视频加载失败 (${esc(e.message)})</div>`;
  }
}

// ============================================================
// MEMBER GRID
// ============================================================
function renderMembers() {
  document.getElementById('memberSections').innerHTML = GENS.map(g => `
    <div class="gen-section">
      <div class="gen-label">
        <span class="gen-dot" style="background:${g.accent}"></span>${g.label}
      </div>
      <div class="scroll-row">
        ${g.members.map(m => `
        <div class="member-card">
          <div class="card-wrap">
            <img class="card-portrait" src="${esc(m.img)}" alt="${esc(m.name)}" loading="lazy">
            <div class="card-divider"></div>
            <a class="card-half card-half-yt" href="${esc(m.yt)}" target="_blank" title="YouTube">
              <svg class="card-icon" viewBox="0 0 24 24"><use href="#ico-yt"/></svg>
            </a>
            <a class="card-half card-half-tw" href="${esc(m.tw)}" target="_blank" title="Twitter / X">
              <svg class="card-icon" viewBox="0 0 24 24"><use href="#ico-x"/></svg>
            </a>
          </div>
          <div class="card-name">${esc(m.name)}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// INIT
// ============================================================
renderMembers();
loadLive();
loadVideos();
setInterval(loadLive, 5 * 60 * 1000);
setInterval(loadVideos, 30 * 60 * 1000);
</script>
